# Une seule API à la fois (même contrat, mêmes tables) :
#   docker compose --profile fastapi up --build   -> http://localhost:8000/docs
#   docker compose --profile spring  up --build   -> http://localhost:8080/health
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: portfolio, POSTGRES_PASSWORD: portfolio, POSTGRES_DB: portfolio }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api-fastapi:
    profiles: ["fastapi"]
    build: ./backend-fastapi
    environment: { DATABASE_URL: "postgresql+psycopg://portfolio:portfolio@db:5432/portfolio" }
    ports: ["8000:8000"]
    depends_on: [db]
  api-spring:
    profiles: ["spring"]
    build: ./backend-spring
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/portfolio
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  pgdata:
